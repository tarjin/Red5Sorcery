name: CloakYourSecrets modernization validation
on:
  push:
    branches: ['review/modernization']
    paths: ['modern/**', '.github/workflows/modern-validation.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native regression
        run: cargo test --locked --manifest-path modern/engine/Cargo.toml
      - name: Compile WebAssembly
        run: cargo build --locked --release --target wasm32-unknown-unknown --manifest-path modern/engine/Cargo.toml
      - name: Generate matching browser bindings
        run: |
          cargo install wasm-bindgen-cli --version 0.2.100 --locked
          wasm-bindgen --target web --out-dir modern/pkg modern/engine/target/wasm32-unknown-unknown/release/rqsm.wasm
      - name: JavaScript syntax
        run: |
          node --check modern/app.mjs
          node --check modern/processor.mjs
          node --check modern/services.mjs
          node --check modern/cloudflare/worker.mjs
      - name: Assemble static package
        run: |
          rm -rf dist
          mkdir -p dist
          cp modern/index.html modern/*.mjs modern/announcements.json modern/favicon.svg modern/CloakYourSecrets_Help.pdf dist/
          cp -r modern/pkg dist/
      - name: Preserve approved Classic deployment
        run: |
          set -euo pipefail
          classic=ef33636d19eb4e2daa14c3fea60979b7f809d4c6
          git fetch --no-tags --depth=1 origin "$classic"
          mkdir -p dist/classic dist/Red5Sorcery
          git show "$classic:dist/index.html" > dist/classic/index.html
          for asset in rqsm-77afaf0d90970a1d.js rqsm-77afaf0d90970a1d_bg.wasm; do
            git show "$classic:dist/$asset" > "dist/Red5Sorcery/$asset"
            cp "dist/Red5Sorcery/$asset" "dist/$asset"
            test "$(git hash-object "dist/Red5Sorcery/$asset")" = "$(git rev-parse "$classic:dist/$asset")"
          done
          test "$(git hash-object dist/classic/index.html)" = "$(git rev-parse "$classic:dist/index.html")"
          grep -Fq 'href="./classic/"' dist/index.html
          touch dist/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: CloakYourSecrets-modern
          path: dist/
          include-hidden-files: true

      - name: Stage production branch (one-time release)
        if: >-
          github.event.head_commit.message == 'CYS-009: Fix release packaging and stage production branch'
        run: |
          set -euo pipefail
          release=release/cys-009
          if git ls-remote --exit-code --heads origin "$release" >/dev/null; then
            echo "Release branch already exists; refusing to overwrite it."
            exit 1
          fi
          git fetch --no-tags --depth=1 origin ace6576e9979d624f078121419a19b5db2c8ad76
          site="$RUNNER_TEMP/cys009-site"
          git worktree add --detach "$site" ace6576e9979d624f078121419a19b5db2c8ad76
          git -C "$site" rm -rf .
          cp -a dist/. "$site/"
          git -C "$site" add -A
          git -C "$site" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "CYS-009: validated modern site and original Classic"
          git -C "$site" push origin "HEAD:refs/heads/$release"
